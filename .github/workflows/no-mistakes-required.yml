name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # Each opening, edit, and push is still judged first on the body that
      # event carried, exactly as before.
      - name: Verify no-mistakes signature and pipeline attestation
        id: event-verdict
        continue-on-error: true
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@32d396ac0f29135daf7fcb9964aba9d5f4e796d6 # post-v1.57.1, untagged (action added in #819)
      # The pipeline pushes a head and rewrites the PR body moments later, and
      # GitHub does not reliably deliver an `edited` run for a rewrite landing
      # seconds after a push, so a stale-body failure could otherwise stay the
      # check's latest verdict for a head whose live body is compliant.
      # On a failed event verdict, wait briefly for the live body to bind this
      # event's head, then re-judge the live facts with the same pinned shared
      # action - the compliance verdict never comes from repo-owned logic.
      - name: Check out the rebind-wait helper
        if: steps.event-verdict.outcome == 'failure'
        uses: actions/checkout@v6
      - name: Wait for the gate to rebind the attestation to this head
        id: rebind
        if: steps.event-verdict.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bin/fm-attestation-rebind-wait.sh
      - name: Re-judge the live PR body with the pinned shared action
        if: steps.event-verdict.outcome == 'failure'
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@32d396ac0f29135daf7fcb9964aba9d5f4e796d6 # post-v1.57.1, untagged (action added in #819)
        with:
          pr-body: ${{ steps.rebind.outputs.body }}
          pr-head-sha: ${{ steps.rebind.outputs.head-sha }}
          pr-head-ref: ${{ github.event.pull_request.head.ref }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-number: ${{ github.event.pull_request.number }}
